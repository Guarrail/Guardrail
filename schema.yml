          maxLength: 56
        signature:
          type: string
          minLength: 1
          description: Hex or Base64 encoded ed25519 signature of the challenge
      required:
      - address
      - signature
  securitySchemes:
    AgentApiKeyAuth:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: AI Agent Secret API Key (prefix + secure token, e.g. gr_live_...)
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
