openapi: 3.0.3
info:
  title: GuardRail Policy Coordinator API
  version: 1.0.0
  description: |-
    GuardRail is a policy-controlled capital management infrastructure built on Stellar that allows AI agents to initiate financial transactions without giving them unrestricted control over digital assets.

    Key Capabilities:
    - Policy Evaluation Engine (Single tx limits, daily/weekly budgets, recipient/asset allowlists)
    - Single-Use Cryptographically Bound Permits (Payload hash verification)
    - Stellar Multisig Guardrail (Agent weight 1, Co-signer weight 1, Threshold 2)
    - Operator Review & Human Approval Workflows
    - Immutable Audit Logging with Stellar Explorer links
    - Soroban Smart Contract Verification & Simulation
paths:
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: Check health status of the GuardRail coordinator service.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
