          application/json:
            schema:
              $ref: '#/components/schemas/AgentSubmitRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentSubmitRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentSubmitRequestRequest'
        required: true
      security:
      - AgentApiKeyAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRequest'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRequest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
