components:
  schemas:
    AIAgent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        agent_id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 150
        description:
          type: string
        wallet:
          type: string
          format: uuid
        policy:
          type: string
          format: uuid
        api_key_prefix:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AIAgentStatusEnum'
        is_operational:
          type: boolean
          readOnly: true
        emergency_disabled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_active_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_id
      - api_key_prefix
      - created_at
      - emergency_disabled_at
      - id
      - is_operational
      - last_active_at
      - name
      - policy
      - updated_at
      - wallet
    AIAgentRequest:
      type: object
      properties:
        agent_id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        wallet:
          type: string
          format: uuid
        policy:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AIAgentStatusEnum'
      required:
      - agent_id
      - name
      - policy
      - wallet
    AIAgentStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - DISABLED
      - REVOKED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
        * `DISABLED` - Emergency Disabled
        * `REVOKED` - Credentials Revoked
    AgentPolicySummaryResponse:
      type: object
      properties:
        agent_id:
          type: string
        wallet_address:
          type: string
        policy:
          type: object
          additionalProperties: {}
        allowed_recipients:
          type: array
          items: {}
        allowed_assets:
          type: array
          items: {}
      required:
      - agent_id
      - allowed_assets
      - allowed_recipients
      - policy
      - wallet_address
    AgentRegistrationResponse:
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/AIAgent'
        api_key:
          type: string
          description: Full plaintext API Key. Displayed only ONCE upon creation.
            Store securely.
        warning:
          type: string
      required:
      - agent
      - api_key
      - warning
    AgentSubmitRequestRequest:
      type: object
      description: Payload submitted by an AI Agent to propose a payment.
      properties:
        request_id:
          type: string
          minLength: 1
          description: Unique client idempotency key
          maxLength: 100
        recipient:
          type: string
          minLength: 1
          description: Destination Stellar address
          maxLength: 56
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,7})?$
        asset:
          type: string
          minLength: 1
          default: XLM
          maxLength: 12
        issuer:
          type: string
          maxLength: 56
        wallet_id:
          type: string
          format: uuid
      required:
      - amount
      - recipient
      - request_id
    AllowedAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        policy:
          type: string
          format: uuid
        asset_code:
          type: string
          default: XLM
          maxLength: 12
        issuer_address:
          type: string
          nullable: true
          maxLength: 56
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - policy
    AllowedAssetRequest:
      type: object
      properties:
        policy:
          type: string
          format: uuid
        asset_code:
          type: string
          minLength: 1
          default: XLM
          maxLength: 12
        issuer_address:
          type: string
          nullable: true
          maxLength: 56
        is_active:
          type: boolean
      required:
      - policy
    AllowedRecipient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        policy:
          type: string
          format: uuid
        address:
          type: string
          maxLength: 56
        label:
          type: string
          maxLength: 150
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - id
      - policy
    AllowedRecipientRequest:
      type: object
      properties:
        policy:
          type: string
          format: uuid
        address:
          type: string
          minLength: 1
          maxLength: 56
        label:
          type: string
          maxLength: 150
        is_active:
          type: boolean
      required:
      - address
      - policy
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        actor_type:
          type: string
          readOnly: true
        actor_id:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        permit_id:
          type: string
          readOnly: true
        stellar_tx_hash:
          type: string
          readOnly: true
        stellar_explorer_url:
          type: string
          readOnly: true
        details:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_id
      - actor_type
      - created_at
      - details
      - event_type
      - id
      - permit_id
      - request_id
      - stellar_explorer_url
      - stellar_tx_hash
    ChallengeRequestRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 56
      required:
      - address
    ChallengeResponse:
      type: object
      properties:
        address:
          type: string
        challenge:
          type: string
        nonce:
          type: string
      required:
      - address
      - challenge
      - nonce
    ControlledWallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        address:
          type: string
          maxLength: 56
        name:
          type: string
          maxLength: 150
        operator:
          type: string
          format: uuid
        network:
          $ref: '#/components/schemas/NetworkEnum'
        is_verified:
          type: boolean
        is_active:
          type: boolean
        master_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        agent_signer_address:
          type: string
          maxLength: 56
        agent_signer_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        cosigner_address:
          type: string
          maxLength: 56
        cosigner_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        threshold_low:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        threshold_med:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        threshold_high:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,7})?$
        asset_code:
          type: string
          maxLength: 12
        is_compliant:
          type: boolean
          readOnly: true
        compliance_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - compliance_message
      - created_at
      - id
      - is_compliant
      - operator
      - updated_at
    ControlledWalletRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 56
        name:
          type: string
          minLength: 1
          maxLength: 150
        operator:
          type: string
          format: uuid
        network:
          $ref: '#/components/schemas/NetworkEnum'
        is_verified:
          type: boolean
        is_active:
